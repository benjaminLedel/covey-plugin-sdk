name: build

# This module is the contract. Everything else in the ecosystem builds against
# it, so the check that matters is not "does it compile" — it is "does it still
# have no dependencies, and do the plugins still build against it".

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

      # A plugin author depends on this module and should get NOTHING else with
      # it. The day somebody adds a convenient library here, every plugin in the
      # world inherits it — so the rule is checked, not remembered.
      - name: No dependencies beyond the standard library
        run: |
          set -euo pipefail
          deps=$(go list -m all | tail -n +2)
          if [ -n "$deps" ]; then
            echo "::error::the contract must stay dependency-free, found:"
            echo "$deps"
            exit 1
          fi
          echo "dependency-free"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # The same two tools Covey runs. govulncheck has little to chew on here —
      # the module has no dependencies, which is the point — but it is the step
      # that would notice the day that stops being true.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      # gosec earns its place: this module joins paths and writes files into a
      # sandbox on behalf of plugins (StoreFile, PruneOldCheckouts). Path
      # handling is exactly what it is good at, and a mistake here would be
      # inherited by every plugin at once.
      - name: gosec
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.22.9 \
            -include=G101,G102,G106,G107,G108,G109,G110,G201,G202,G203,G303,G305,G401,G402,G403,G404,G501,G502,G503,G504,G505 \
            -exclude-dir=.go ./...

  plugins-still-build:
    name: the plugin pack still builds against this
    runs-on: ubuntu-latest
    # Informational: the pack may legitimately lag behind a change here, and a
    # red tick on this repository's pull request would say the wrong thing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk
      - uses: actions/checkout@v4
        with:
          repository: benjaminLedel/covey-plugin-pack
          path: pack
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build the pack against this checkout
        run: |
          set -euo pipefail
          cd pack
          go mod edit -replace github.com/benjaminLedel/covey-plugin-sdk=../sdk
          GOFLAGS=-mod=mod go mod tidy
          go build ./...
          go test ./... -count=1
